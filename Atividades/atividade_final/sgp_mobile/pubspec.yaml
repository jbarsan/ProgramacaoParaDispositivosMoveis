name: sgp_mobile
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_maps_flutter: ^2.19.0
  google_maps_routes: ^1.1.2
  google_sign_in: ^7.2.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.2
  image_picker: ^1.2.4
  http: ^1.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Permite que google_maps_routes/flutter_polyline_points utilize a versão atual de http.
dependency_overrides:
  http: ^1.6.0

flutter:

  # the material Icons class.
  uses-material-design: true

  # Arquivo de variáveis de ambiente e avatares locais
  assets:
    - .env
    - assets/images/
