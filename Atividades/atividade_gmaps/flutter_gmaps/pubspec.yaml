name: flutter_gmaps
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.19.0 # Plugin para adicionar mapas do Google
  cupertino_icons: ^1.0.8 # Ícones do iOS
  geolocator: ^14.1.2 # Plugin para obter a localização do usuário

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/pin/ # Adicionando o ícone personalizado

